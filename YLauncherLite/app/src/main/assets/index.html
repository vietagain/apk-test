<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Y Smart Home - Cấu hình Web</title>
<style>
  body { font-family: system-ui, sans-serif; background: #0f172a; color: #f8fafc; margin: 0; padding: 16px; }
  .container { max-width: 760px; margin: auto; }
  h2 { color: #38bdf8; margin-top: 0; }
  .card { background: #1e293b; border-radius: 12px; padding: 16px; margin-bottom: 16px; border: 1px solid #334155; }
  label { display: block; font-size: 13px; color: #94a3b8; margin-bottom: 4px; margin-top: 10px; }
  input, select { width: 100%; box-sizing: border-box; padding: 10px; border-radius: 8px; border: 1px solid #475569; background: #0f172a; color: #fff; font-size: 14px; }
  input[type="range"] { padding: 0; }
  input[type="checkbox"] { width: auto; transform: scale(1.2); margin-right: 6px; }
  .row { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
  .row > div { flex: 1; min-width: 140px; }
  button { padding: 10px 16px; border: none; border-radius: 8px; font-weight: bold; cursor: pointer; font-size: 14px; }
  .btn-save { background: #22c55e; color: #052e16; width: 100%; font-size: 16px; margin-top: 8px; }
  .btn-add { background: #38bdf8; color: #082f49; margin-top: 10px; }
  .btn-sm { padding: 6px 10px; font-size: 12px; margin-left: 4px; }
  .btn-del { background: #ef4444; color: #fff; }
  .btn-move { background: #475569; color: #fff; }
  .tile-item { background: #0f172a; padding: 12px; border-radius: 8px; margin-top: 10px; border: 1px solid #334155; }
  .tile-header { display: flex; justify-content: space-between; align-items: center; }
  #msg { position: fixed; bottom: 16px; right: 16px; background: #22c55e; color: #000; padding: 12px 20px; border-radius: 8px; display: none; font-weight: bold; z-index: 99; }
  #haStatusBadge { display: inline-block; font-size: 12px; padding: 4px 10px; border-radius: 20px; background: #334155; color: #cbd5e1; margin-left: 8px; }
</style>
</head>
<body>
<div class="container">
  <h2>⚡ Y Smart Home - Cấu hình <span id="haStatusBadge">Đang tải danh sách HA...</span></h2>

  <datalist id="ha-all-entities"></datalist>
  <datalist id="ha-weather-entities"></datalist>
  <datalist id="ha-sensor-entities"></datalist>

  <div class="card">
    <div class="row" style="justify-content: space-between;">
      <h3 style="margin:0;">1. Kết nối Home Assistant</h3>
      <button class="btn-add" style="margin-top:0; padding:6px 12px; font-size:12px;" onclick="syncHaEntities(true)">🔄 Tải lại danh sách từ HA</button>
    </div>
    <label>Địa chỉ Home Assistant (URL)</label>
    <input id="haUrl" placeholder="http://192.168.1.100:8123">

    <label>Long-Lived Access Token</label>
    <input id="haToken" type="password" placeholder="Dán mã Token từ HA vào đây...">

    <div class="row">
      <div>
        <label>Chu kỳ cập nhật (giây)</label>
        <input id="refreshIntervalSec" type="number" min="1" max="60" value="3">
      </div>
      <div>
        <label>Màu nền mặc định</label>
        <select id="theme">
          <option value="dark">Tối (Dark)</option>
          <option value="green">Xanh lá (Green)</option>
          <option value="scifi">Sci-Fi</option>
        </select>
      </div>
    </div>
  </div>

  <div class="card">
    <h3>2. Hình nền & Độ trong suốt của các ô</h3>
    <label>Chọn ảnh nền từ điện thoại / máy tính</label>
    <div class="row">
      <div><input type="file" id="wpFile" accept="image/*"></div>
      <div style="flex: 0 0 auto;">
        <button class="btn-add" style="margin-top:0;" onclick="uploadWallpaper()">⬆ Tải ảnh nền</button>
        <button class="btn-del" onclick="deleteWallpaper()">Xóa ảnh</button>
      </div>
    </div>

    <label>Độ đậm nền các ô: <strong id="opacityVal" style="color:#38bdf8;">80%</strong></label>
    <input type="range" id="tileOpacity" min="0" max="100" value="80" oninput="document.getElementById('opacityVal').innerText = this.value + '%'">
  </div>

  <div class="card">
    <h3>3. Thời tiết & Cảm biến đầu trang</h3>
    <div class="row">
      <div>
        <label>Entity Thời tiết (weather.*)</label>
        <input id="weatherEntity" list="ha-weather-entities" placeholder="Bấm để chọn weather...">
      </div>
      <div>
        <label>Cảm biến Công suất (W)</label>
        <input id="powerEntity" list="ha-sensor-entities" placeholder="Bấm để chọn cảm biến W...">
      </div>
    </div>
    <div class="row">
      <div>
        <label>Cảm biến Nhiệt độ (°C)</label>
        <input id="tempEntity" list="ha-sensor-entities" placeholder="Bấm để chọn cảm biến nhiệt độ...">
      </div>
      <div>
        <label>Cảm biến Độ ẩm (%)</label>
        <input id="humEntity" list="ha-sensor-entities" placeholder="Bấm để chọn cảm biến độ ẩm...">
      </div>
    </div>
  </div>

  <div class="card">
    <h3>4. Danh sách Thẻ & Kích thước ô</h3>
    <div id="tilesList"></div>
    <button class="btn-add" onclick="addTile()">+ Thêm thẻ mới</button>
  </div>

  <button class="btn-save" onclick="saveConfig(true)">💾 LƯU & ÁP DỤNG NGAY</button>
</div>

<div id="msg">Đã lưu cấu hình thành công!</div>

<script>
let configData = { tiles: [] };
let haEntitiesMap = {};

function showToast(text) {
  const m = document.getElementById('msg');
  m.innerText = text;
  m.style.display = 'block';
  setTimeout(() => m.style.display = 'none', 2500);
}

async function loadConfig() {
  const res = await fetch('/api/config?t=' + Date.now());
  configData = await res.json();
  document.getElementById('haUrl').value = configData.haUrl || '';
  document.getElementById('haToken').value = configData.haToken || '';
  document.getElementById('refreshIntervalSec').value = configData.refreshIntervalSec || 3;
  document.getElementById('theme').value = configData.theme || 'dark';
  const op = (configData.tileOpacity !== undefined) ? configData.tileOpacity : 80;
  document.getElementById('tileOpacity').value = op;
  document.getElementById('opacityVal').innerText = op + '%';
  document.getElementById('weatherEntity').value = configData.weatherEntity || '';
  document.getElementById('tempEntity').value = configData.tempEntity || '';
  document.getElementById('humEntity').value = configData.humEntity || '';
  document.getElementById('powerEntity').value = configData.powerEntity || '';
  renderTiles();
  syncHaEntities(false);
}

async function syncHaEntities(saveFirst) {
  const badge = document.getElementById('haStatusBadge');
  badge.innerText = 'Đang lấy danh sách HA...';
  if (saveFirst) await saveConfig(false);
  try {
    const res = await fetch('/api/ha_entities?t=' + Date.now());
    const data = await res.json();
    if (!res.ok || data.error) {
      badge.innerText = 'Chưa kết nối HA';
      badge.style.background = '#7f1d1d';
      if (saveFirst) alert(data.error || 'Lỗi kết nối HA');
      return;
    }
    const allList = document.getElementById('ha-all-entities');
    const weatherList = document.getElementById('ha-weather-entities');
    const sensorList = document.getElementById('ha-sensor-entities');
    allList.innerHTML = '';
    weatherList.innerHTML = '';
    sensorList.innerHTML = '';
    haEntitiesMap = {};

    data.forEach(item => {
      haEntitiesMap[item.id] = item;
      const label = `${item.name} (${item.state}${item.unit ? ' ' + item.unit : ''})`;
      const optHtml = `<option value="${item.id}">${label}</option>`;
      allList.insertAdjacentHTML('beforeend', optHtml);
      if (item.id.startsWith('weather.')) weatherList.insertAdjacentHTML('beforeend', optHtml);
      if (item.id.startsWith('sensor.')) sensorList.insertAdjacentHTML('beforeend', optHtml);
    });

    badge.innerText = `✓ Đã nạp ${data.length} thiết bị HA`;
    badge.style.background = '#14532d';
    badge.style.color = '#86efac';
  } catch (e) {
    badge.innerText = 'Lỗi tải danh sách HA';
  }
}

function onEntitySelected(idx, val) {
  configData.tiles[idx].entityId = val;
  const info = haEntitiesMap[val];
  if (info) {
    configData.tiles[idx].name = info.name;
    if (val.startsWith('cover.')) configData.tiles[idx].type = 'gate';
    else if (val.startsWith('sensor.') || val.startsWith('binary_sensor.')) {
      configData.tiles[idx].type = 'sensor';
      if (info.unit) configData.tiles[idx].unit = info.unit;
    } else configData.tiles[idx].type = 'switch';
    renderTiles();
  }
}

function onTypeChanged(idx, newType) {
  configData.tiles[idx].type = newType;
  if (newType === 'solar_flow') {
    configData.tiles[idx].size = 'large';
    configData.tiles[idx].name = 'Luồng Điện Solar';
  }
  renderTiles();
}

function renderTiles() {
  const box = document.getElementById('tilesList');
  box.innerHTML = '';
  (configData.tiles || []).forEach((t, idx) => {
    const sz = t.size || 'medium';
    const isSolar = t.type === 'solar_flow';

    let fieldsHtml = '';
    if (isSolar) {
      fieldsHtml = `
        <div class="row">
          <div>
            <label>Cảm biến Công suất PV (W/kW)</label>
            <input value="${t.pvEntity || ''}" list="ha-sensor-entities" placeholder="sensor.pv_power..." onchange="configData.tiles[${idx}].pvEntity = this.value">
          </div>
          <div>
            <label>Cảm biến Công suất Tải Nhà (W/kW)</label>
            <input value="${t.loadEntity || ''}" list="ha-sensor-entities" placeholder="sensor.load_power..." onchange="configData.tiles[${idx}].loadEntity = this.value">
          </div>
        </div>
        <div class="row">
          <div>
            <label>Cảm biến Công suất Pin (W/kW)</label>
            <input value="${t.batPowerEntity || ''}" list="ha-sensor-entities" placeholder="sensor.battery_power..." onchange="configData.tiles[${idx}].batPowerEntity = this.value">
          </div>
          <div>
            <label>Cảm biến % Pin (SoC)</label>
            <input value="${t.batSocEntity || ''}" list="ha-sensor-entities" placeholder="sensor.battery_soc..." onchange="configData.tiles[${idx}].batSocEntity = this.value">
          </div>
        </div>
        <label style="margin-top:8px; color:#cbd5e1;">
          <input type="checkbox" ${t.invertBatPower ? 'checked' : ''} onchange="configData.tiles[${idx}].invertBatPower = this.checked">
          Đảo chiều công suất Pin (tích nếu số Dương là Đang xả, số Âm là Đang sạc)
        </label>
      `;
    } else {
      fieldsHtml = `
        <div class="row">
          <div>
            <label>Entity ID (Bấm hoặc gõ tên để chọn)</label>
            <input value="${t.entityId || ''}" list="ha-all-entities" placeholder="Bấm để chọn thiết bị HA..." onchange="onEntitySelected(${idx}, this.value)">
          </div>
          <div>
            <label>Tên hiển thị</label>
            <input value="${t.name || ''}" onchange="configData.tiles[${idx}].name = this.value">
          </div>
          <div>
            <label>Đơn vị (nếu là cảm biến)</label>
            <input value="${t.unit || ''}" placeholder="W, V, %, °C..." onchange="configData.tiles[${idx}].unit = this.value">
          </div>
        </div>
      `;
    }

    box.innerHTML += `
      <div class="tile-item">
        <div class="tile-header">
          <strong>Ô #${idx + 1} - ${t.name || 'Thiết bị'}</strong>
          <div>
            <button class="btn-sm btn-move" onclick="moveTile(${idx}, -1)">↑</button>
            <button class="btn-sm btn-move" onclick="moveTile(${idx}, 1)">↓</button>
            <button class="btn-sm btn-del" onclick="removeTile(${idx})">Xóa</button>
          </div>
        </div>
        <div class="row">
          <div>
            <label>Loại thẻ</label>
            <select onchange="onTypeChanged(${idx}, this.value)">
              <option value="switch" ${t.type==='switch'?'selected':''}>Công tắc / Đèn / Quạt</option>
              <option value="gate" ${t.type==='gate'?'selected':''}>Cổng / Cửa cuốn (Mở-Dừng-Đóng)</option>
              <option value="sensor" ${t.type==='sensor'?'selected':''}>Cảm biến hiển thị số</option>
              <option value="solar_flow" ${t.type==='solar_flow'?'selected':''}>☀ Biểu đồ luồng điện Solar (Chuyển động)</option>
            </select>
          </div>
          <div>
            <label>Kích thước ô</label>
            <select onchange="configData.tiles[${idx}].size = this.value">
              <option value="small" ${sz==='small'?'selected':''}>Nhỏ (1x1 - 1 cột)</option>
              <option value="medium" ${sz==='medium'?'selected':''}>Vừa (2x1 - 2 cột ngang)</option>
              <option value="wide" ${sz==='wide'?'selected':''}>Rộng (4x1 - Cả hàng ngang)</option>
              <option value="large" ${sz==='large'?'selected':''}>Lớn (2x2 - Ô vuông to)</option>
            </select>
          </div>
        </div>
        ${fieldsHtml}
      </div>`;
  });
}

function moveTile(idx, dir) {
  const target = idx + dir;
  if (target < 0 || target >= configData.tiles.length) return;
  const temp = configData.tiles[idx];
  configData.tiles[idx] = configData.tiles[target];
  configData.tiles[target] = temp;
  renderTiles();
}

function addTile() {
  configData.tiles.push({
    id: 'tile_' + Date.now(),
    type: 'switch',
    size: 'medium',
    name: 'Thiết bị mới',
    entityId: '',
    unit: ''
  });
  renderTiles();
}

function removeTile(idx) {
  configData.tiles.splice(idx, 1);
  renderTiles();
}

async function uploadWallpaper() {
  const input = document.getElementById('wpFile');
  if (!input.files || !input.files[0]) {
    alert('Vui lòng chọn một file ảnh trước!');
    return;
  }
  const file = input.files[0];
  const img = new Image();
  img.src = URL.createObjectURL(file);
  img.onload = async () => {
    const canvas = document.createElement('canvas');
    const maxDim = 1280;
    let w = img.width, h = img.height;
    if (w > maxDim || h > maxDim) {
      if (w > h) { h = Math.round(h * maxDim / w); w = maxDim; }
      else { w = Math.round(w * maxDim / h); h = maxDim; }
    }
    canvas.width = w;
    canvas.height = h;
    canvas.getContext('2d').drawImage(img, 0, 0, w, h);
    canvas.toBlob(async (blob) => {
      const res = await fetch('/api/wallpaper', { method: 'POST', body: blob });
      if (res.ok) showToast('Đã cập nhật hình nền!');
    }, 'image/jpeg', 0.82);
  };
}

async function deleteWallpaper() {
  const res = await fetch('/api/wallpaper', { method: 'DELETE' });
  if (res.ok) showToast('Đã xóa hình nền!');
}

async function saveConfig(notify) {
  configData.haUrl = document.getElementById('haUrl').value;
  configData.haToken = document.getElementById('haToken').value;
  configData.refreshIntervalSec = parseInt(document.getElementById('refreshIntervalSec').value) || 3;
  configData.theme = document.getElementById('theme').value;
  configData.tileOpacity = parseInt(document.getElementById('tileOpacity').value);
  configData.weatherEntity = document.getElementById('weatherEntity').value;
  configData.tempEntity = document.getElementById('tempEntity').value;
  configData.humEntity = document.getElementById('humEntity').value;
  configData.powerEntity = document.getElementById('powerEntity').value;

  const res = await fetch('/api/config', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify(configData)
  });
  if (res.ok && notify) showToast('Đã lưu cấu hình thành công!');
}

loadConfig();
</script>
</body>
</html>
